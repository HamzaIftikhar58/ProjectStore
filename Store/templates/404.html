<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) | ProjectStore.pk</title>
    <meta name="robots" content="noindex, follow">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            max-width: 600px;
            text-align: center;
            background: white;
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 80px;
            font-weight: 800;
            color: #3b82f6;
            line-height: 1;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h2>Page Not Found</h2>
        <p class="text-muted mb-4">The page you are looking for might have been moved or renamed. Explore our products and DIY project store below.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'home' %}" class="btn btn-primary">Go to Homepage</a>
            <a href="{% url 'product' %}" class="btn btn-outline-secondary rounded-pill px-4">Browse Products</a>
            <a href="{% url 'project' %}" class="btn btn-outline-secondary rounded-pill px-4">View Projects</a>
        </div>
    </div>
</body>
</html>
