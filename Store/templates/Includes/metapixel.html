{% if META_PIXEL_ID %}
<!-- Meta Pixel Code -->
<script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '{{ META_PIXEL_ID }}');
  fbq('track', 'PageView');

  // Auto-tracker: listens for clicks on [data-fb-event] elements.
  // Supports optional [data-fb-params] for JSON event parameters.
  document.addEventListener('click', function(e) {
      const target = e.target.closest('[data-fb-event]');
      if (target && window.fbq) {
          const eventName = target.getAttribute('data-fb-event');
          let params = {};
          const rawParams = target.getAttribute('data-fb-params');
          if (rawParams) {
              try { params = JSON.parse(rawParams); } catch(err) {}
          }
          fbq('track', eventName, params);
      }
  });
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id={{ META_PIXEL_ID }}&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->
{% endif %}
