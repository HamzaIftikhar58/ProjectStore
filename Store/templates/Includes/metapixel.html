{% if META_PIXEL_ID %}
<!-- Meta Pixel Code (Optimized Non-Blocking) -->
<script>
  // Immediate stub so any fbq() calls queue safely without throwing ReferenceError
  if (!window.fbq) {
    window.fbq = function() {
      window.fbq.callMethod ? window.fbq.callMethod.apply(window.fbq, arguments) : window.fbq.queue.push(arguments);
    };
    window.fbq.push = window.fbq;
    window.fbq.loaded = true;
    window.fbq.version = '2.0';
    window.fbq.queue = [];
  }

  function initMetaPixel() {
    if (window._metaPixelLoaded) return;
    window._metaPixelLoaded = true;
    var t = document.createElement('script');
    t.async = true;
    t.src = 'https://connect.facebook.net/en_US/fbevents.js';
    var s = document.getElementsByTagName('script')[0];
    s.parentNode.insertBefore(t, s);
    fbq('init', '{{ META_PIXEL_ID }}');
    fbq('track', 'PageView');
  }

  if (document.readyState === 'complete') {
    setTimeout(initMetaPixel, 1200);
  } else {
    window.addEventListener('load', function() {
      setTimeout(initMetaPixel, 1200);
    });
  }

  // Auto-tracker: listens for clicks on [data-fb-event] elements.
  document.addEventListener('click', function(e) {
      const target = e.target.closest('[data-fb-event]');
      if (target && window.fbq) {
          const eventName = target.getAttribute('data-fb-event');
          let params = {};
          const rawParams = target.getAttribute('data-fb-params');
          if (rawParams) {
              try { params = JSON.parse(rawParams); } catch(err) {}
          }
          fbq('track', eventName, params);
      }
  });
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id={{ META_PIXEL_ID }}&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->
{% endif %}
